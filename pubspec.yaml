name: agritrace_mobile
description: AgriTrace MVP — Flutter mobile app | Offline-First | Drift SQLite | Farmer-First traceability
publish_to: 'none'
version: 1.9.6+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.3
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  share_plus: ^10.0.0
  # In-app issue reporting (v1.8.0): capture device + app metadata so the
  # bug report posted to /v1/feedback (→ GitHub Issues) carries the context
  # we'd otherwise have to ask the user for. `device_info_plus` is the
  # canonical Flutter package for OS/model metadata; `package_info_plus`
  # exposes the version+build from pubspec at runtime.
  # device_info_plus pinned to 12.x: 13.x depends on win32 ^6.0.1 which
  # conflicts with flutter_secure_storage_windows ^3.1.2 (win32 ^5). The
  # Android API surface we use (`model`, `version.release`) is identical
  # across 12.x and 13.x.
  device_info_plus: ^12.0.0
  # package_info_plus pinned to 9.x for the same win32 reason as
  # device_info_plus above (10.x depends on win32 ^6 which conflicts with
  # flutter_secure_storage_windows ^3.1.2 → win32 ^5). The API
  # `PackageInfo.fromPlatform()` is identical across 9.x and 10.x.
  package_info_plus: ^9.0.0
  # v1.9.0 — Activity photo capture (gallery + camera) and farm-form GPS
  # capture. `image_picker` is the canonical Flutter package; `geolocator`
  # exposes `getCurrentPosition()`; `permission_handler` is needed to
  # request runtime camera + location permissions on Android 6+.
  image_picker: ^1.1.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  # Multipart helper used by `UploadsService` when posting the captured photo
  # to `POST /v1/uploads/photos`. `http_parser` provides `MediaType` so we
  # can set the correct `Content-Type` per file (image/jpeg vs image/png).
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# App launcher icon generation (output dirs are git-ignored Flutter
# platform folders; run after `flutter pub get`):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"
  android: true
  ios: false # Android-only project (no iOS asset catalog); see CLAUDE.md
  remove_alpha_ios: true
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/brand/icon-1024.png"
