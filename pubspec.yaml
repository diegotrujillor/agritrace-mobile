name: agritrace_mobile
description: AgriTrace MVP — Flutter mobile app | Offline-First | Drift SQLite | Farmer-First traceability
publish_to: 'none'
version: 1.7.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.3
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# App launcher icon generation (output dirs are git-ignored Flutter
# platform folders; run after `flutter pub get`):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"
  android: true
  ios: false # Android-only project (no iOS asset catalog); see CLAUDE.md
  remove_alpha_ios: true
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/brand/icon-1024.png"
