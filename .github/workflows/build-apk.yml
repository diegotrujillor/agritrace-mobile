name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to bake into the build"
        required: false
        default: "https://api.agritrace.co/v1"

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/agritrace-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=agritrace-release.keystore
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        # Errors/warnings fail the build; style infos don't block a pilot APK.
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api.agritrace.co/v1' }}

      - name: Clean up secrets
        if: always()
        run: rm -f android/key.properties android/agritrace-release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agritrace-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
