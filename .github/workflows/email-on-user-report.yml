name: Email Diego when a user-report issue is opened

# In-app feedback (CU-28) calls `POST /v1/feedback` on the backend,
# which creates a GitHub issue via the `GITHUB_FEEDBACK_TOKEN` PAT.
# Because that PAT belongs to the repo owner (diegotrujillor),
# GitHub suppresses self-notifications and no email is sent. This
# workflow forwards the issue body to Diego's inbox so the pilot
# operator notices the bug without polling the GitHub UI.
#
# Trigger: issue opened AND label `user-report` is present (the
# backend always attaches that label, see agritrace-backend
# feedback.service.ts). QA-manual / internal issues are skipped.
#
# Required GitHub repo secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#   - GMAIL_USER         the Gmail address that sends the email
#                        (recommend a dedicated sender, e.g.
#                        diegotrujillor+agritrace@gmail.com)
#   - GMAIL_APP_PASSWORD a 16-character App Password generated at
#                        https://myaccount.google.com/apppasswords
#                        (NOT the regular Google account password —
#                        requires 2FA enabled first)

on:
  issues:
    # `opened` fires when the issue is created with labels already
    # attached (the typical backend path: `POST /v1/feedback` sends
    # title + body + labels atomically). `labeled` is a safety net for
    # cases where the label is applied in a second call (e.g. gh CLI
    # smoke tests, manual triage). The `if:` guard prevents double
    # emails — when both events fire we only act on the one that
    # already has the label.
    types: [opened, labeled]

permissions:
  contents: read
  issues: read

jobs:
  email:
    if: contains(github.event.issue.labels.*.name, 'user-report')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send email via Gmail SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[AgriTrace bug] #${{ github.event.issue.number }} ${{ github.event.issue.title }}"
          to: diegotrujillor@gmail.com
          from: "AgriTrace Bot <${{ secrets.GMAIL_USER }}>"
          body: |
            Nuevo reporte de productor (CU-28 / in-app feedback).

            Issue #${{ github.event.issue.number }}
            Autor: ${{ github.event.issue.user.login }}
            URL:   ${{ github.event.issue.html_url }}
            Etiquetas: ${{ join(github.event.issue.labels.*.name, ', ') }}

            ---
            ${{ github.event.issue.body }}
